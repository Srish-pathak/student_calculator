<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report Card · Student Marks Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf6ea;--card:#fffdf7;--ink:#1f2a44;--muted:#6b7288;--line:#e3d9c0;--accent:#c8412b;--ok:#2f7d5b;--bad:#c8412b;--warn:#a8741a;--shadow:0 2px 0 rgba(31,42,68,.08),0 10px 24px rgba(31,42,68,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1c2b27;--card:#243630;--ink:#eef2e6;--muted:#a3b5a8;--line:#3a5148;--accent:#ffd166;--ok:#8fe0b0;--bad:#ff8a7a;--warn:#ffd166;--shadow:0 10px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1c2b27;--card:#243630;--ink:#eef2e6;--muted:#a3b5a8;--line:#3a5148;--accent:#ffd166;--ok:#8fe0b0;--bad:#ff8a7a;--warn:#ffd166;--shadow:0 10px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--paper);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif;
background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:860px;margin:0 auto;padding:2.5rem 1.25rem 4rem 2.25rem;position:relative}
main::before{content:"";position:absolute;left:1rem;top:0;bottom:0;width:2px;background:var(--accent);opacity:.5}
h1{font:800 clamp(2rem,6vw,3.2rem)/1.05 Fraunces,Georgia,serif;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:.5rem 0 1.75rem;max-width:46ch}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1.1rem;box-shadow:var(--shadow);margin-bottom:1.5rem}
.row{display:grid;grid-template-columns:1fr 2fr auto;gap:.75rem;margin-bottom:.5rem}
input,button{font:inherit;color:var(--ink);min-width:0}
input{background:transparent;border:0;border-bottom:2px solid var(--line);padding:.5rem .15rem;border-radius:0}
input::placeholder{color:var(--muted)}
input:focus{outline:0;border-bottom-color:var(--accent)}
button{cursor:pointer;background:transparent;border:2px solid var(--ink);border-radius:999px;padding:.5rem 1rem;font-weight:600}
button:hover{background:var(--ink);color:var(--card)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.x{border:0;padding:.3rem .6rem;color:var(--muted)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.primary:hover{filter:brightness(1.08);background:var(--accent);color:#fff}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
.hint{color:var(--muted);font-size:.85rem;margin:.8rem 0 0}
.summary{display:flex;gap:1.5rem;flex-wrap:wrap;margin:0 0 1rem;font-family:Fraunces,Georgia,serif}
.summary div{display:grid}.summary b{font-size:1.6rem;line-height:1.1}.summary small{font:400 .8rem Inter,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1rem 1rem 1.1rem;box-shadow:var(--shadow)}
.card h2{font:600 1.25rem Fraunces,Georgia,serif;margin:0 4.2rem .5rem 0;overflow-wrap:anywhere}
.chips{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.8rem}
.chips span{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 .4rem;font-size:.85rem}
.stats{display:flex;gap:1.2rem}.stats div{display:grid}.stats b{font-size:1.15rem}.stats small{color:var(--muted);font-size:.75rem}
.stamp{position:absolute;top:.8rem;right:.8rem;width:3.4rem;height:3.4rem;border:3px solid currentColor;border-radius:50%;display:grid;place-items:center;
font:800 1.35rem Fraunces,Georgia,serif;transform:rotate(-8deg);opacity:.92}
.stamp.pass{color:var(--ok)}.stamp.fail{color:var(--bad);font-size:.85rem}
.err{color:var(--warn);font-weight:600;margin:.2rem 0 0}
.theme{position:absolute;right:1.25rem;top:calc(1rem + env(safe-area-inset-top,0px));border-width:1px;font-size:.8rem;padding:.25rem .7rem}
@media (max-width:520px){.row{grid-template-columns:1fr auto}.row input:nth-child(2){grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<main>
  <button class="theme" id="theme" type="button">Toggle theme</button>
  <h1>Report <span>Card</span></h1>
  <p class="sub">List each student’s marks, separated by commas. Totals, averages and grades are worked out right in your browser.</p>

  <section class="sheet">
    <div id="rows"></div>
    <div class="actions">
      <button id="addRow" type="button">+ Add student</button>
      <button id="calc" class="primary" type="button">Calculate</button>
      <button id="sample" type="button">Sample data</button>
    </div>
    <p class="hint">A = 90+ · B = 75+ · C = 50+ · below 50 is a Fail. Marks can’t be negative.</p>
  </section>

  <section id="out" hidden>
    <div class="summary" id="summary"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);

function gradeFor(avg) {
  if (avg >= 90) return "A";
  if (avg >= 75) return "B";
  if (avg >= 50) return "C";
  return "Fail";
}

function calculate(marks) {
  if (marks.length === 0) return { error: "No marks available" };
  if (marks.some((m) => Number.isNaN(m))) return { error: "Marks must be numbers" };
  if (marks.some((m) => m < 0)) return { error: "Invalid marks (negative)" };
  const total = marks.reduce((a, b) => a + b, 0);
  const average = total / marks.length;
  return { total, average, grade: gradeFor(average) };
}

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach((k) => n.append(k));
  return n;
}

function addRow(name = "", marks = "") {
  const row = el("div", { className: "row" });
  const x = el("button", { type: "button", className: "x", textContent: "✕", ariaLabel: "Remove student" });
  x.onclick = () => row.remove();
  row.append(
    el("input", { placeholder: "Student name", value: name, ariaLabel: "Student name" }),
    el("input", { placeholder: "Marks, e.g. 90, 85, 95", value: marks, ariaLabel: "Marks" }), x);
  $("rows").append(row);
}

function stat(label, value) { return el("div", {}, el("b", { textContent: value }), el("small", { textContent: label })); }

function run() {
  const grid = $("grid"), results = [];
  grid.replaceChildren();
  [...$("rows").children].forEach((row, i) => {
    const [n, m] = row.querySelectorAll("input");
    const raw = m.value.split(",").map((s) => s.trim()).filter(Boolean);
    const marks = raw.map(Number), r = calculate(marks);
    const name = n.value.trim() || `Student ${i + 1}`;
    const card = el("article", { className: "card" }, el("h2", { textContent: name }));
    if (r.error) {
      card.append(el("p", { className: "err", textContent: r.error }));
    } else {
      const pass = r.grade !== "Fail";
      results.push({ name, ...r, pass });
      card.append(
        el("div", { className: "stamp " + (pass ? "pass" : "fail"), textContent: pass ? r.grade : "FAIL" }),
        el("div", { className: "chips" }, marks.map((x) => el("span", { textContent: x }))),
        el("div", { className: "stats" }, stat("Total", r.total), stat("Average", r.average.toFixed(1)), stat("Result", pass ? "Pass" : "Fail")));
    }
    grid.append(card);
  });
  const sum = $("summary");
  sum.replaceChildren();
  if (results.length) {
    const avg = results.reduce((a, r) => a + r.average, 0) / results.length;
    const top = results.reduce((a, b) => (b.average > a.average ? b : a));
    sum.append(stat("Class average", avg.toFixed(1)), stat("Top scorer", top.name), stat("Passed", `${results.filter((r) => r.pass).length} of ${results.length}`));
  }
  $("out").hidden = grid.children.length === 0;
}

function sample() {
  $("rows").replaceChildren();
  addRow("Rahul", "90, 85, 95"); addRow("Priya", "60, 70, 80"); addRow("Aman", "");
  run();
}

$("addRow").onclick = () => addRow();
$("calc").onclick = run;
$("sample").onclick = sample;
$("theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};
sample();
</script>
</body>
</html>
